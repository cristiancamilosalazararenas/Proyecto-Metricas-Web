<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informe de métricas web</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">Proyecto Cypress + Lighthouse</p>
        <h1>Informe de métricas web</h1>
        <p id="updated">Cargando resultados…</p>
      </header>
      <section id="summary" class="cards"></section>
      <section>
        <h2>Historial de ejecuciones</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>URL</th><th>Dispositivo</th><th>Fecha</th><th>FCP</th><th>LCP</th><th>Speed Index</th><th>Performance</th><th>Estado</th>
              </tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
      </section>
      <section>
        <h2>Comparación de ejecuciones</h2>
        <div id="comparisons" class="comparison-list"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
